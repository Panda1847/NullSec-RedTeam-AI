name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and developer tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Run tests with focused control-plane coverage
        run: >-
          pytest
          --cov=modules.aura
          --cov=modules.domain
          --cov=modules.runners
          --cov=modules.worker.job_store
          --cov=modules.brain.security
          --cov=modules.payloads.jailbreak_tester
          --cov-report=term-missing
      - name: Lint
        run: ruff check .
      - name: Type check modern control-plane modules
        run: >-
          mypy
          modules/aura
          modules/domain
          modules/runners
          modules/worker/job_store.py
          modules/brain/security.py
          modules/payloads/jailbreak_tester.py

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install security tooling
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Static security analysis
        run: bandit -r modules utils -ll
      - name: Dependency audit
        run: pip-audit --ignore-vuln PYSEC-2026-2447
      - name: Build distribution
        run: python -m pip install build && python -m build

  action-security:
    name: GitHub Action security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
