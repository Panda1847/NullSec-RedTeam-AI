[build-system]
requires = ["setuptools>=83,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "nullsec-redteam-ai"
version = "7.1.0"
description = "Authorization-first, MCP-governed security execution platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "NullSec Operations", email = "ops@nullsec.local" },
]
keywords = ["mcp", "security", "automation", "authorized-testing", "auditability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "Flask>=3.0,<4",
  "Werkzeug>=3.0,<4",
  "gunicorn>=22,<24",
  "requests>=2.31,<3",
  "urllib3>=2.0,<3",
  "fastmcp>=3.2,<4",
  "pydantic>=2.7,<3",
  "flask-limiter>=3.8,<4",
  "cryptography>=50,<51",
  "psutil>=5.9,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "mypy>=1.10,<3",
  "bandit>=1.7,<2",
  "pip-audit>=2.7,<3",
]
lab = [
  "openai>=1.0,<4",
  "anthropic>=0.30,<1",
]
observability = [
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
]

[project.scripts]
hexstrike-server = "modules.brain.hexstrike_server:main"
hexstrike-mcp = "modules.brain.hexstrike_mcp:main"
guardian = "modules.brain.guardian:main"
nullsec-worker = "modules.worker.worker:main"
ai-lab = "modules.payloads.jailbreak_tester:main"

[project.urls]
Homepage = "https://github.com/Panda1847/NullSec-RedTeam-AI"
Repository = "https://github.com/Panda1847/NullSec-RedTeam-AI"
Issues = "https://github.com/Panda1847/NullSec-RedTeam-AI/issues"
Security = "https://github.com/Panda1847/NullSec-RedTeam-AI/security/policy"

[tool.setuptools.packages.find]
include = ["modules*", "utils*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["modules", "utils"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
